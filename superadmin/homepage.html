<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        /* Global styles */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #e2e2e2, #c9d6ff);
            font-family: Arial, sans-serif;
            color: #444;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            color: #333;
            margin: 20px 0;
        }

        /* Header styles */
        .header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background-color: #5a6d8c;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .header button {
            padding: 12px 20px;
            margin-left: 15px;
            background-color: #ffffff;
            color: #5a6d8c;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid #5a6d8c;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .header button:hover {
            background-color: #5a6268;
            color: white;
        }

        /* Content styles */
        .content {
            padding-top: 120px; /* To avoid content getting hidden behind the fixed header */
            text-align: center;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 20px;
            width: 200px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card h2 {
            color: #5a6d8c;
            font-size: 1.3rem;
        }

        .logout-btn {
            background-color: #ff4b5c;
            color: white;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .logout-btn:hover {
            background-color: #e14050;
        }
    </style>
    <script type="module" src="./homepage.js"></script>
</head>
<body>
    <!-- Header with Profile and Logout buttons -->
    <div class="header">
        <button id="profile">Profile</button>
        <button id="logout">Logout</button>
    </div>

    <!-- Main Content Section -->
    <div class="content">
        <h1>Welcome, Super Admin</h1>

        <!-- Cards Section -->
        <div class="card-container">
            <div class="card" id="sellersCard">
                <h2>List of Sellers</h2>
            </div>
            <div class="card" id="categoriesCard">
                <h2>List of Categories</h2>
            </div>
        </div>
    </div>
</body>
</html>
