<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Eazy Tech</title>
    <link rel="stylesheet" href="matin-login.css">
    <link rel="stylesheet" href="profile.css">
    <script type="module" src="profile.js"></script>
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="logo">
            <div class="logo-text">
                <img src="logo.png" alt="Eazy Tech Logo" class="logo-image">
            </div>
            <div class="tagline">The Science today is the tech of tomorrow</div>
        </div>
        <input type="text" placeholder="Electronics for every need" class="search-bar">
        <div class="buttons">
            <button onclick="window.location.href='homepage.html'">Home</button>
            <button id="logoutBtn">Logout</button>
        </div>
    </header>

    <!-- Profile Main Content -->
    <main class="profile-container">
        <h1>Your Profile</h1>
        <section class="profile-info">
            <h2>Profile Information</h2>
            <div><strong>First Name:</strong> <span id="userFName"></span></div>
            <div><strong>Last Name:</strong> <span id="userLName"></span></div>
            <div><strong>Email:</strong> <span id="userEmail"></span></div>
        </section>
    </main>

        <div class="footer-right">
            <a href="#">NOT A USER? SIGN IN</a>

        </div>
        <div class="footer-center">
            <a href="#">ABOUT US!</a>
        </div>
        <p>© Eazy Tech ALL RIGHTS RESERVED</p>
    </footer>
</body>
</html>
