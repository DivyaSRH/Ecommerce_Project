<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Page</title>
    <link rel="stylesheet" href="category.css">
</head>
<body>
    <header id="categoryHeader">
        <div class="category-card">
            <img id="categoryImage" src="" alt="Category Image">
            <div class="category-info">
                <h2 id="categoryTitle">Category Title</h2>
            </div>
        </div>
    </header>
    <div id="productGallery" class="product-grid"></div>

    <!-- Firebase App and Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js"></script>

    <!-- Separate JavaScript file for category functionality -->
    <script type="module" src="category.js"></script>
</body>
</html>
