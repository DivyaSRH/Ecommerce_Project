<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Eazy Tech</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Arshad-signup.css">
    <script type="module" src="signup.js"></script>
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="logo">
            <div class="logo-text"><img src="logo.png" alt="Eazy Tech Logo" class="logo-image"></div>
            <div class="tagline">The Science today is the tech of tomorrow</div>
        </div>
        <input type="text" placeholder="Electronics for every need" class="search-bar">
        <div class="buttons">
            
        </div>
    </header>

    <!-- Signup Form Section -->
    <section class="signup-section">
        <h2>Sign Up</h2>
        <form class="signup-form" id="signUpForm">
            <label for="fName">First Name:</label>
            <input type="text" id="fName" placeholder="Enter your first name" required>

            <label for="lName">Last Name:</label>
            <input type="text" id="lName" placeholder="Enter your last name" required>

            <label for="rEmail">Email:</label>
            <input type="email" id="rEmail" placeholder="Enter your email" required>

            <label for="rPassword">Password:</label>
            <input type="password" id="rPassword" placeholder="Enter your password" required>

            <button type="submit" class="signup-btn" id="submitSignUp">Sign Up</button>
        </form>
        <p class="login-prompt">Already an user?</p> <button onclick="window.location.href='login.html'" class="login-btn">Login</button>
    </section>

    <!-- Footer Section -->
    <footer>
        <div class="footer-right">
            <a href="#">Not a user? Sign in</a> 
        </div>
        <div class="footer-center">
            <a href="#">About Us!</a>
        </div>
        <p>© Eazy Tech All Rights Reserved</p>
    </footer>
</body>
</html>
