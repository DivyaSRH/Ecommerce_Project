<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Eazy Tech</title>
    <link rel="stylesheet" href="matin-login.css">
    <script type="module" src="login.js"></script>
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="logo">
            <div class="logo-text"><img src="logo.png" alt="Eazy Tech Logo" class="logo-image"></div>
            <div class="tagline">The Science today is the tech of tomorrow</div>
        </div>
        <input type="text" placeholder="Electronics for every need" class="search-bar">
        <div class="buttons">
            
            
        </div>
    </header>

    <!-- Login Form Section -->
    <section class="login-section">
        <div class="left-image">
            <img src="your-image-path.jpg" alt="Description of image" class="image"> <!-- Add your image path -->
        </div>
        <div class="login-form-container">
            <img src="logo.png" alt="Eazy Tech Logo" class="logo-image"> <!-- Logo Image -->
            <form id="loginForm" class="login-form">
                <label for="email">Email:</label>
                <input type="email" id="email" required placeholder="Enter your email">
                
                <label for="password">Password:</label>
                <input type="password" id="password" required placeholder="Enter your password">
                
                <!-- New Links -->
                <div class="links">
                    <a href="#" class="link">Forgot Password?</a>
                    <span> | </span> <!-- Optional: Separator between links -->
                    <a href="signup.html" class="link">New User? Sign Up!</a>
                </div>
                
                <button type="submit" id="submitLogin" class="login-btn">LOGIN</button> 
            </form>
        </div>
    </section>

    <!-- Footer Section -->
    <footer>
        <div class="footer-right">
            <a href="#">NOT A USER? SIGN IN</a>
            <br><br>
        </div>
        <div class="footer-center">
            <a href="#">ABOUT US!</a>
        </div>
        <p>© Eazy Tech ALL RIGHTS RESERVED</p>
    </footer>
</body>
</html>
